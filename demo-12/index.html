<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCO kiểm thử</title>
<style>body{font-family:system-ui,sans-serif;margin:16px;color:#333E48} button{min-height:44px;margin:4px 0;width:100%} pre{white-space:pre-wrap;font-size:12px}</style>
</head><body>
<h1 id="title">Bài kiểm thử SCORM</h1>
<p id="status">Đang kết nối…</p>
<pre id="state" style="background:#f4f5f6;padding:8px;font-size:14px"></pre>
<button id="next" type="button">Trang tiếp</button>
<button id="pass" type="button">Làm bài đạt 85 điểm</button>
<button id="done" type="button">Kết thúc bài</button>
<button id="pause" type="button">Tạm dừng (lưu để học tiếp)</button>
<pre id="log"></pre>
<script src="sco.js"></script>
</body></html>
